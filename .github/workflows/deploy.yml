# Builds the site with Eleventy and publishes _site/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# The deploy step needs permission to publish to Pages and to verify its identity (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land quickly, finish the running deploy and queue only the latest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs mise, then the tools pinned in mise.toml (Node), and caches them between runs.
      - uses: jdx/mise-action@v5
      # Same command you run locally: install (npm ci) → clean → eleventy → _site/
      - run: mise run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
